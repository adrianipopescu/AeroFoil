name: Fork test build (GHCR)

on:
  push:
    branches:
      - fix/control-nca-header-only
      - combined-fixes

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          # tag = branch name (slashes swapped for dashes) so each fork-test branch gets its own tag
          tags: ghcr.io/adrianipopescu/aerofoil:${{ steps.tag.outputs.tag }}
